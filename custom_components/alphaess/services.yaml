setbatterycharge:
  name: Set Battery Charge
  description: >
    Enables setting Alpha ESS Grid Charging Settings via the periodic
    schedule API (primary). On systems where AlphaESS answers 6017 (no
    permission) for the periodic API, the legacy two-slot endpoints are used
    as a backup instead; power fields are unsupported there. On periodic
    systems AlphaESS requires at least one charge period and one discharge
    period in the same schedule, so a one-sided call cannot initialise a
    completely empty schedule: create one period of each type in the
    AlphaESS app first, or stage both sides with the schedule entities and
    Apply. On periodic systems the Scheduled Charging and
    Scheduled Discharging switches must both have been set once before any
    call is accepted: AlphaESS never reports those two flags, and sending a
    guess could switch the inverter to self-consumption.
  fields:
    serial:
      name: Serial
      description: Your Alpha ESS Serial number.
      required: true
      example: AA123456789
      selector:
        text:
    enabled:
      name: Enabled
      description: Enable Grid Charging battery.
      required: true
      example: True
      default: True
      selector:
        boolean:
    cp1start:
      name: Charging Period 1 Start
      description: Charging Period 1 Start.
      required: true
      example: "01:00"
      default: "00:00"
      selector:
        text:
          type: time
    cp1end:
      name: Charging Period 1 End
      description: Charging Period 1 End.
      required: true
      example: "04:00"
      default: "00:00"
      selector:
        text:
          type: time
    cp2start:
      name: Charging Period 2 Start
      description: Charging Period 2 Start.
      required: true
      example: "01:00"
      default: "00:00"
      selector:
        text:
          type: time
    cp2end:
      name: Charging Period 2 End
      description: Charging Period 2 End.
      required: true
      example: "04:00"
      default: "00:00"
      selector:
        text:
          type: time
    cp1power:
      name: Charging Period 1 Power
      description: Power in watts. Required when creating a new periodic slot.
      required: false
      selector:
        number:
          min: 1
          max: 100000
          unit_of_measurement: W
    cp2power:
      name: Charging Period 2 Power
      description: Power in watts. Required when creating a new periodic slot.
      required: false
      selector:
        number:
          min: 1
          max: 100000
          unit_of_measurement: W
    chargestopsoc:
      name: Charge Cutoff
      description: Charging Stops at SOC [%].
      required: true
      example: 100
      default: 100
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
setbatterydischarge:
  name: Set Battery Discharge
  description: >
    Enables setting Alpha ESS Battery Discharge Settings via the periodic
    schedule API (primary). On systems where AlphaESS answers 6017 (no
    permission) for the periodic API, the legacy two-slot endpoints are used
    as a backup instead; power fields are unsupported there, and on the new
    AlphaESS server the inverter may not act on the legacy discharge store.
    On periodic systems AlphaESS requires at least one charge period and one
    discharge period in the same schedule, so a one-sided call cannot
    initialise a completely empty schedule: create one period of each type
    in the AlphaESS app first, or stage both sides with the schedule
    entities and Apply. On periodic systems the Scheduled Charging and
    Scheduled Discharging switches must both have been set once before any
    call is accepted: AlphaESS never reports those two flags, and sending a
    guess could switch the inverter to self-consumption.
  fields:
    serial:
      name: Serial
      description: Your Alpha ESS Serial number.
      required: true
      example: AA123456789
      selector:
        text:
    enabled:
      name: Enabled
      description: Enable Battery Discharge.
      required: true
      example: True
      default: True
      selector:
        boolean:
    dp1start:
      name: Discharging Period 1 Start
      description: Discharging Period 1 Start.
      required: true
      example: "01:00"
      default: "00:00"
      selector:
        text:
          type: time
    dp1end:
      name: Discharging Period 1 End
      description: Discharging Period 1 End.
      required: true
      example: "04:00"
      default: "00:00"
      selector:
        text:
          type: time
    dp2start:
      name: Discharging Period 2 Start
      description: Discharging Period 2 Start.
      required: true
      example: "01:00"
      default: "00:00"
      selector:
        text:
          type: time
    dp2end:
      name: Discharging Period 2 End
      description: Discharging Period 2 End.
      required: true
      example: "04:00"
      default: "00:00"
      selector:
        text:
          type: time
    dp1power:
      name: Discharging Period 1 Power
      description: Power in watts. Required when creating a new periodic slot.
      required: false
      selector:
        number:
          min: 1
          max: 100000
          unit_of_measurement: W
    dp2power:
      name: Discharging Period 2 Power
      description: Power in watts. Required when creating a new periodic slot.
      required: false
      selector:
        number:
          min: 1
          max: 100000
          unit_of_measurement: W
    dischargecutoffsoc:
      name: Discharging Cutoff
      description: Discharging Cutoff SOC [%].
      required: true
      example: 10
      default: 10
      selector:
        number:
          min: 10
          max: 100
          unit_of_measurement: "%"
